<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>트레일러 | 경계의 문</title>
  <style>
    :root {
      --bg: #02070a;
      --panel: #f4efe6;
      --red: #9f2334;
      --blue: #1b6875;
      --gold: #c29a42;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 0%, rgba(27, 104, 117, 0.18), transparent 26rem),
        radial-gradient(circle at 82% 8%, rgba(159, 35, 52, 0.22), transparent 24rem),
        linear-gradient(180deg, var(--bg), #010304 72%);
      color: var(--panel);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      line-height: 1.72;
      word-break: keep-all;
    }

    a {
      color: inherit;
    }

    .top-line {
      height: 5px;
      background: linear-gradient(90deg, var(--red), var(--gold), var(--blue));
    }

    .page-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(2, 7, 10, 0.78);
      border-bottom: 1px solid rgba(244, 239, 230, 0.12);
      backdrop-filter: blur(16px);
    }

    .page-nav a {
      padding: 8px 12px;
      border: 1px solid rgba(244, 239, 230, 0.16);
      border-radius: 999px;
      color: #eafcff;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      text-shadow: 0 0 10px rgba(126, 226, 255, 0.22);
    }

    .page-nav a.is-active {
      border-color: rgba(194, 154, 66, 0.55);
      background: rgba(194, 154, 66, 0.14);
      color: #f5e6c8;
    }

    .wrap {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      padding: 48px 0 24px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.05em;
      color: #f5e6c8;
      text-shadow: 0 0 28px rgba(194, 154, 66, 0.24);
    }

    .subtitle {
      margin: 14px 0 0;
      color: #cbd9d8;
      font-size: clamp(15px, 2.2vw, 18px);
      font-weight: 700;
    }

    .video-shell {
      margin: 28px auto 0;
      max-width: 420px;
      padding: 12px;
      background:
        radial-gradient(circle at 50% 0%, rgba(159, 35, 52, 0.18), transparent 18rem),
        linear-gradient(180deg, rgba(5, 12, 17, 0.98), rgba(1, 4, 7, 0.99));
      border: 1px solid rgba(194, 154, 66, 0.22);
      border-top: 3px solid var(--red);
      box-shadow:
        0 0 0 1px rgba(159, 35, 52, 0.18),
        0 0 34px rgba(159, 35, 52, 0.16),
        var(--shadow);
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #020406;
      border: 1px solid rgba(244, 239, 230, 0.1);
    }

    .video-frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .platform-section {
      margin-top: 36px;
      padding: 24px 20px 28px;
      background: rgba(5, 12, 17, 0.72);
      border: 1px solid rgba(244, 239, 230, 0.12);
      box-shadow: var(--shadow);
    }

    .platform-section h2 {
      margin: 0 0 10px;
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: 22px;
      color: #f5e6c8;
    }

    .platform-notice {
      margin: 0 0 20px;
      color: #a8bab8;
      font-size: 14px;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid rgba(126, 226, 255, 0.28);
      background: linear-gradient(180deg, #1a5f75 0%, #0e2a33 100%);
      color: #eafcff;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(126, 226, 255, 0.55);
      background: linear-gradient(180deg, #237d96 0%, #12404d 100%);
    }

    footer {
      padding: 40px 0 60px;
      color: #8aa0a2;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .platform-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <main class="wrap">

  </main>

  <footer>
    경계의 문 · 대한민국 경계관리청 부산지부 · 2036
